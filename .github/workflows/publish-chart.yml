name: Lint and Publish Helm Chart

on:
  push:
    branches:
      - s3rj1k

env:
  CHART_PATH: .
  REGISTRY: ghcr.io

jobs:
  lint-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm chart
        run: |
          helm lint ${{ env.CHART_PATH }} --strict

      - name: Get chart version
        id: version
        run: |
          VERSION=$(grep '^version:' ${{ env.CHART_PATH }}/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Package Helm chart
        run: |
          helm package ${{ env.CHART_PATH }}

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Get chart name
        id: chart_name
        run: |
          CHART_NAME=$(helm show chart ${{ env.CHART_PATH }} | grep '^name:' | awk '{print $2}')
          echo "name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "Chart name: $CHART_NAME"

      - name: Push chart to OCI registry
        run: |
          CHART_PACKAGE="${{ steps.chart_name.outputs.name }}-${{ steps.version.outputs.version }}.tgz"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "$CHART_PACKAGE" oci://${{ env.REGISTRY }}/${OWNER_LOWER}/charts

      - name: Output published chart info
        env:
          CHART_NAME: ${{ steps.chart_name.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          OWNER_LOWER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_PATH="${REGISTRY}/${OWNER_LOWER}/charts/${CHART_NAME}"
          {
            echo "## Chart published"
            echo ""
            echo "**Registry:** \`${REGISTRY_PATH}\`"
            echo "**Version:** \`${VERSION}\`"
            echo ""
            echo '```bash'
            echo "helm install my-release oci://${REGISTRY_PATH} --version ${VERSION}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
